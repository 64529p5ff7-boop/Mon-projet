<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// Rendu image par image : window.render(t) dessine l'instant t (secondes).
const W=1080,H=1920,cv=document.getElementById('c'),g=cv.getContext('2d');
const C={night:'#0B0E1F',night2:'#141A3A',ink:'#F5F3EE',mute:'#8E93B5',sun:'#FFB648',sun2:'#FF6B3D',real:'#EDEBFF',barca:'#E0336B',blue:'#3D5BFF',line:'rgba(255,255,255,.10)'};
const F=(w,s,fam)=>`${w} ${s}px "${fam||'Inter Display'}"`;
let TL=null;

// Points clés (numéro du Clasico, victoires Real, victoires Barça) tirés de la vidéo source.
const KP=[[0,0,0],[13,5,6],[18,9,6],[24,13,7],[120,56,40],[177,76,68],[196,82,76],[199,82,77],[208,85,81],[218,86,86],[232,93,91],[241,94,95],[242,95,96],[248,100,96],[249,100,97],[254,102,100],[261,105,104],[263,106,105],[264,106,106]];
// Courbe d'écart plus vivante entre les points clés (oscillation qui s'annule aux points clés).
function score(m){
  for(let i=1;i<KP.length;i++){const a=KP[i-1],b=KP[i];if(m<=b[0]){const u=(m-a[0])/((b[0]-a[0])||1);
    const w=Math.sin(u*Math.PI)*Math.sin(m*0.33)*Math.min(1.4,(b[0]-a[0])/30);
    return {r:a[1]+(b[1]-a[1])*u+w*.5,b:a[2]+(b[2]-a[2])*u-w*.5};}}
  return {r:106,b:106};
}
const YEARS=[[0,'1902'],[60,'1950'],[120,'1965'],[196,'2005'],[242,'2019'],[264,'2026']];
const SEG={
 s4:{to:13,chip:'01 · LES DÉBUTS',big:'6–5',sub:'LE BARÇA MÈNE',col:C.barca},
 s5:{to:18,chip:'02 · LE BASCULEMENT',big:'1933',sub:'MADRID PASSE DEVANT',col:C.real},
 s6:{to:177,chip:'02 · LE LONG RÈGNE',big:'85 ANS',sub:'SANS LE BARÇA EN TÊTE',col:C.real,note:[120,'+16 POUR MADRID (1965)']},
 s7:{to:196,chip:"03 · L'ÈRE MESSI",big:'2005',sub:'MESSI · 18 ANS · 1ER CLASICO',col:C.sun},
 s8:{to:208,chip:"03 · L'ÈRE MESSI",big:'26',sub:'BUTS CONTRE LE REAL · RECORD',col:C.sun,balls:26},
 s9:{to:218,chip:'04 · LE RETOUR',big:'86–86',sub:'LE BARÇA DE GUARDIOLA',col:C.ink},
 s10:{to:242,chip:'05 · LE DÉPASSEMENT',big:'2.03.19',sub:'RAKITIĆ · BARÇA DEVANT',col:C.barca,tag:'1RE FOIS DEPUIS 1931'},
 s11:{to:248,chip:'06 · LA RIPOSTE',big:'×5',sub:"CLASICOS D'AFFILÉE POUR MADRID",col:C.real},
 s12:{to:256,chip:"07 · L'ÈRE FLICK",big:'6/7',sub:'HANSI FLICK',col:C.sun,dots:true},
 s13:{to:263,chip:"07 · L'ÈRE FLICK",big:'6/7',sub:'HANSI FLICK',col:C.sun,dots:true,list:['4-0 AU BERNABÉU','COUPE DU ROI','2 SUPERCOUPES','10 MAI 2026 · 2-0 · TITRE']},
 s14:{to:264,chip:"07 · L'ÈRE FLICK",big:'106–106',sub:'ÉGALITÉ PARFAITE',col:C.sun}
};
const ease=x=>x<0?0:x>1?1:1-Math.pow(1-x,3);
const eio=x=>x<0?0:x>1?1:x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const cl=(x,a,b)=>Math.max(a,Math.min(b,x));

function rr(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r);}
function txt(s,x,y,font,col,align='center',a=1){g.globalAlpha=a;g.font=font;g.fillStyle=col;g.textAlign=align;g.textBaseline='alphabetic';g.fillText(s,x,y);g.globalAlpha=1;}

function background(t){
  const p=t/TL.total;                       // le ciel « se lève » au fil de la vidéo
  const gr=g.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,C.night);gr.addColorStop(.7,C.night2);gr.addColorStop(1,`rgba(${60+90*p|0},${30+40*p|0},${60-10*p|0},1)`);
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  const sy=H+260-380*eio(p), rad=g.createRadialGradient(W/2,sy,0,W/2,sy,900);
  rad.addColorStop(0,`rgba(255,182,72,${.30+.25*p})`);rad.addColorStop(.35,`rgba(255,107,61,${.12+.12*p})`);rad.addColorStop(1,'rgba(255,107,61,0)');
  g.fillStyle=rad;g.fillRect(0,0,W,H);
  // grain léger
  g.globalAlpha=.035;for(let i=0;i<160;i++){const x=(Math.sin(i*91.7+t*31)*.5+.5)*W,y=(Math.cos(i*37.3+t*17)*.5+.5)*H;g.fillStyle='#fff';g.fillRect(x,y,2,2);}g.globalAlpha=1;
}
function brand(){
  // logo : soleil levant + nom
  g.save();g.translate(90,150);
  g.beginPath();g.arc(0,0,26,Math.PI,0);g.fillStyle=C.sun;g.fill();
  g.fillRect(-40,4,80,5);
  for(let i=0;i<5;i++){const a=Math.PI+(i+1)*Math.PI/6;g.strokeStyle=C.sun;g.lineWidth=5;g.lineCap='round';g.beginPath();g.moveTo(Math.cos(a)*36,Math.sin(a)*36);g.lineTo(Math.cos(a)*48,Math.sin(a)*48);g.stroke();}
  g.restore();
  txt('WAKE UP SMART',158,166,F(900,40),C.ink,'left');
  txt('CLASICO · 1902 → 2026',W-90,166,F(500,26,'JetBrains Mono'),C.mute,'right');
}
function chip(s,y,a){g.globalAlpha=a;g.font=F(800,30);const w=g.measureText(s).width+56;rr(90,y-40,w,58,29);g.fillStyle='rgba(255,182,72,.14)';g.fill();g.strokeStyle='rgba(255,182,72,.55)';g.lineWidth=2;g.stroke();txt(s,118,y,F(800,30),C.sun,'left',a);g.globalAlpha=1;}

function scoreboard(sc,y){
  const r=Math.round(sc.r),b=Math.round(sc.b),tot=Math.max(1,r+b);
  txt('REAL MADRID',90,y,F(700,30),C.mute,'left');txt('FC BARCELONE',W-90,y,F(700,30),C.mute,'right');
  txt(String(r),90,y+110,F(900,110),C.real,'left');txt(String(b),W-90,y+110,F(900,110),C.barca,'right');
  // barre de « tir à la corde »
  const bx=90,bw=W-180,by=y+140,sh=r/tot;
  rr(bx,by,bw,22,11);g.fillStyle='rgba(255,255,255,.08)';g.fill();
  g.save();rr(bx,by,bw,22,11);g.clip();
  g.fillStyle=C.real;g.fillRect(bx,by,bw*sh,22);
  const gb=g.createLinearGradient(bx+bw*sh,0,bx+bw,0);gb.addColorStop(0,C.barca);gb.addColorStop(1,C.blue);g.fillStyle=gb;g.fillRect(bx+bw*sh,by,bw*(1-sh),22);
  g.restore();
  g.fillStyle=C.sun;g.fillRect(W/2-2,by-10,4,42);
  const d=r-b;const lab=d===0?'ÉGALITÉ':(d>0?`MADRID +${d}`:`BARÇA +${-d}`);
  txt(lab,W/2,by+62,F(800,30,'JetBrains Mono'),d===0?C.sun:(d>0?C.real:C.barca));
}

function chart(m,t,segT,S){
  const x0=90,x1=W-90,y0=860,y1=1270,zero=y0+(y1-y0)*20/27;
  const X=k=>x0+(x1-x0)*k/264, Y=d=>zero-(d/27)*(y1-y0);
  // grille
  g.strokeStyle=C.line;g.lineWidth=2;
  for(const d of [-5,5,10,15,20]){g.setLineDash([6,10]);g.beginPath();g.moveTo(x0,Y(d));g.lineTo(x1,Y(d));g.stroke();}
  g.setLineDash([]);g.strokeStyle='rgba(255,182,72,.6)';g.lineWidth=3;g.beginPath();g.moveTo(x0,zero);g.lineTo(x1,zero);g.stroke();
  txt('MADRID DEVANT ↑',x0,y0-14,F(700,24,'JetBrains Mono'),C.real,'left',.7);
  txt('BARÇA DEVANT ↓',x0,y1+10,F(700,24,'JetBrains Mono'),C.barca,'left',.8);
  for(const [k,yr] of YEARS){txt(yr,X(k),y1+56,F(500,22,'JetBrains Mono'),m>=k?C.ink:C.mute,k===0?'left':k===264?'right':'center',m>=k?.9:.4);}
  // courbe
  const pts=[];for(let k=0;k<=m;k+=0.5){const s=score(k);pts.push([X(k),Y(s.r-s.b)]);}
  const s=score(m);pts.push([X(m),Y(s.r-s.b)]);
  if(pts.length>1){
    for(const side of [1,-1]){g.save();g.beginPath();g.rect(0,side>0?0:zero,W,side>0?zero:H);g.clip();
      g.beginPath();g.moveTo(pts[0][0],zero);for(const p of pts)g.lineTo(p[0],p[1]);g.lineTo(pts[pts.length-1][0],zero);g.closePath();
      const gr=g.createLinearGradient(0,side>0?y0:zero,0,side>0?zero:y1);
      if(side>0){gr.addColorStop(0,'rgba(237,235,255,.55)');gr.addColorStop(1,'rgba(237,235,255,.05)');}else{gr.addColorStop(0,'rgba(224,51,107,.1)');gr.addColorStop(1,'rgba(224,51,107,.75)');}
      g.fillStyle=gr;g.fill();g.restore();}
    g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.strokeStyle=C.ink;g.lineWidth=5;g.lineJoin='round';g.stroke();
    const hp=pts[pts.length-1],pulse=1+.25*Math.sin(t*8);
    g.beginPath();g.arc(hp[0],hp[1],26*pulse,0,7);g.fillStyle='rgba(255,182,72,.25)';g.fill();
    g.beginPath();g.arc(hp[0],hp[1],11,0,7);g.fillStyle=C.sun;g.fill();
    if(S&&S.note&&m>=S.note[0]){const nx=X(S.note[0]),ny=Y(16);const a=ease((m-S.note[0])/20);
      g.globalAlpha=a;g.beginPath();g.arc(nx,ny,8,0,7);g.fillStyle=C.real;g.fill();g.globalAlpha=1;
      txt(S.note[1],nx,ny-26,F(800,26,'JetBrains Mono'),C.real,'center',a);}
    txt(`CLASICO N°${Math.round(m)}`,x1,y0-14,F(700,24,'JetBrains Mono'),C.mute,'right',.9);
  }
}

function highlight(S,segT,dur){
  const a=ease(segT/.35),dy=(1-a)*40;
  g.save();g.translate(0,dy);
  txt(S.big,90,745,F(900,S.big.length>6?120:150),S.col,'left',a);
  txt(S.sub,92,792,F(800,30),C.ink,'left',a*.9);
  if(S.tag){const ta=ease((segT-dur*.55)/.3);if(ta>0){g.font=F(800,28);const w=g.measureText(S.tag).width+40;g.globalAlpha=ta;rr(W-90-w,690,w,54,12);g.fillStyle=C.sun;g.fill();txt(S.tag,W-90-w/2,727,F(800,28),C.night,'center',ta);}}
  g.restore();
  if(S.balls){for(let i=0;i<26;i++){const ba=ease((segT-.4-i*.08)/.25);if(ba<=0)continue;const cx=630+(i%9)*42,cy=650+Math.floor(i/9)*44;g.globalAlpha=ba;g.beginPath();g.arc(cx,cy,16*ba,0,7);g.fillStyle=C.sun;g.fill();g.globalAlpha=1;}}
  if(S.dots){for(let i=0;i<7;i++){const ba=ease((segT-.3-i*.12)/.25);g.globalAlpha=Math.max(.0,ba);g.beginPath();g.arc(640+i*54,700,20,0,7);g.fillStyle=i<6?C.sun:'rgba(255,255,255,.18)';g.fill();g.globalAlpha=1;}}
  if(S.list){S.list.forEach((s,i)=>{const la=ease((segT-.2-i*1.25)/.35);if(la<=0)return;g.font=F(800,30);const w=g.measureText(s).width+44;const x=W-90-w,y=880+i*72;g.globalAlpha=la;rr(x+(1-la)*60,y,w,58,14);g.fillStyle=i===3?C.sun:'rgba(20,26,58,.9)';g.fill();g.strokeStyle='rgba(255,182,72,.6)';g.lineWidth=2;g.stroke();txt(s,x+(1-la)*60+w/2,y+40,F(800,30),i===3?C.night:C.ink,'center',la);g.globalAlpha=1;});}
}

// Sous-titres : 1 à 4 mots, mot actif surligné.
function captions(t){
  const s=TL.segs.find(s=>t>=s.start&&t<s.start+s.dur+.25);if(!s)return;
  const words=s.cap.split(' '),wt=words.map(w=>w.replace(/[^\p{L}\p{N}]/gu,'').length+2),sum=wt.reduce((a,b)=>a+b,0);
  const chunks=[];let cur=[],cl_=0;words.forEach((w,i)=>{cur.push(i);cl_+=w.length+1;if(cl_>18||/[.,:?…]$/.test(w)||i===words.length-1){chunks.push(cur);cur=[];cl_=0;}});
  const u=cl((t-s.start)/s.dur,0,.999);let acc=0,wi=0;for(let i=0;i<words.length;i++){acc+=wt[i]/sum;if(u<acc){wi=i;break;}wi=i;}
  const ch=chunks.find(c=>c.includes(wi));const y=1480;
  g.font=F(900,66);const sp=g.measureText(' ').width;const ws=ch.map(i=>words[i].toUpperCase());const tw=ws.reduce((a,w)=>a+g.measureText(w).width,0)+sp*(ws.length-1);
  let x=W/2-tw/2;const pop=ease((t-(s.start+(ch[0]?wt.slice(0,ch[0]).reduce((a,b)=>a+b,0)/sum*s.dur:0)))/.12);
  ch.forEach((i,j)=>{const w=ws[j],mw=g.measureText(w).width;
    if(i===wi){rr(x-12,y-62,mw+24,82,14);g.fillStyle=C.sun;g.fill();}
    g.lineWidth=10;g.strokeStyle='rgba(0,0,0,.55)';g.lineJoin='round';g.textAlign='left';g.font=F(900,66);if(i!==wi)g.strokeText(w,x,y);
    g.fillStyle=i===wi?C.night:(i<wi?C.ink:'rgba(245,243,238,.75)');g.globalAlpha=.4+.6*pop;g.fillText(w,x,y);g.globalAlpha=1;x+=mw+sp;});
}

function intro(t){
  const S=id=>TL.segs.find(s=>s.id===id);const s1=S('s1'),s2=S('s2'),s3=S('s3');
  const a1=ease((t-s1.start)/.4);
  const n=t<s3.start+s3.dur*.6?264:Math.round(264*(1-eio((t-(s3.start+s3.dur*.6))/(s3.dur*.4+.2))));
  txt(String(n),W/2,720,F(900,300),C.ink,'center',a1);
  txt('CLASICOS',W/2,800,F(800,52),C.sun,'center',a1);
  const a2=ease((t-s2.start)/.4),a2b=ease((t-s2.start-1.3)/.4);
  if(a2>0){txt('106',W/4+20,1080,F(900,190),C.real,'center',a2);txt('VICTOIRES MADRID',W/4+20,1140,F(700,28),C.mute,'center',a2);}
  if(a2b>0){txt('106',3*W/4-20,1080,F(900,190),C.barca,'center',a2b);txt('VICTOIRES BARÇA',3*W/4-20,1140,F(700,28),C.mute,'center',a2b);}
  const a3=ease((t-s3.start)/.3);if(a3>0){g.globalAlpha=a3;rr(W/2-44,980,88,88,44);g.fillStyle=C.sun;g.fill();txt('=',W/2,1048,F(900,80),C.night,'center',a3);}
  const rw=ease((t-(s3.start+s3.dur*.6))/.3);if(rw>0){txt('⏪  ON REMBOBINE',W/2,1260,F(800,40,'Inter Display'),C.sun,'center',rw);}
  chip('LE PLUS GRAND MATCH DU MONDE',290,a1);
}

function goals(t){
  const s15=TL.segs.find(s=>s.id==='s15'),s16=TL.segs.find(s=>s.id==='s16');
  chip('08 · ET LES BUTS ?',290,1);
  const p1=eio((t-s15.start-1.1)/1.4),p2=eio((t-s15.start-2.8)/1.4);
  const bx=90,bw=W-180;
  txt('BUTS · REAL MADRID',bx,640,F(700,30),C.mute,'left');rr(bx,665,bw,110,18);g.fillStyle='rgba(255,255,255,.06)';g.fill();
  rr(bx,665,Math.max(36,bw*p1),110,18);g.fillStyle=C.real;g.fill();txt(String(Math.round(444*p1)),bx+Math.max(36,bw*p1)-24,745,F(900,64),C.night,'right',p1>.1?1:0);
  txt('BUTS · FC BARCELONE',bx,880,F(700,30),C.mute,'left');rr(bx,905,bw,110,18);g.fillStyle='rgba(255,255,255,.06)';g.fill();
  const w2=Math.max(36,bw*441/444*p2);rr(bx,905,w2,110,18);const gb=g.createLinearGradient(bx,0,bx+bw,0);gb.addColorStop(0,C.barca);gb.addColorStop(1,C.blue);g.fillStyle=gb;g.fill();txt(String(Math.round(441*p2)),bx+w2-24,985,F(900,64),C.ink,'right',p2>.1?1:0);
  const a=ease((t-s16.start)/.35);
  if(a>0){txt('3',W/2,1260,F(900,220*(0.8+.2*a)),C.sun,'center',a);txt("BUTS D'ÉCART EN 124 ANS",W/2,1320,F(800,40),C.ink,'center',a);}
}

function cta(t,s){
  const a=ease((t-s.start)/.5);
  g.save();g.translate(W/2,820);g.scale(.85+.15*a,.85+.15*a);g.globalAlpha=a;
  g.beginPath();g.arc(0,40,120,Math.PI,0);g.fillStyle=C.sun;g.fill();g.fillRect(-170,48,340,12);
  for(let i=0;i<7;i++){const ang=Math.PI+(i+.5)*Math.PI/7;g.strokeStyle=C.sun;g.lineWidth=12;g.lineCap='round';g.beginPath();g.moveTo(Math.cos(ang)*150,40+Math.sin(ang)*150);g.lineTo(Math.cos(ang)*190,40+Math.sin(ang)*190);g.stroke();}
  g.restore();
  txt('WAKE UP SMART',W/2,1010,F(900,96),C.ink,'center',a);
  txt('1 truc à savoir · 1 minute · chaque jour',W/2,1080,F(600,36),C.mute,'center',a);
  const b=ease((t-s.start-.9)/.4);if(b>0){g.globalAlpha=b;rr(W/2-210,1150,420,96,48);g.fillStyle=C.sun;g.fill();txt('+  ABONNE-TOI',W/2,1213,F(900,40),C.night,'center',b);}
}

window.render=function(t){
  background(t);brand();
  const cur=[...TL.segs].reverse().find(s=>t>=s.start)||TL.segs[0];
  const id=cur.id, n=+id.slice(1);
  if(n<=3) intro(t);
  else if(n<=14){
    const S=SEG[id],prev=TL.segs[TL.segs.indexOf(cur)-1],from=SEG[prev.id]?SEG[prev.id].to:0;
    const segT=t-cur.start, ca=n===4?ease(segT/.5):1;
    g.globalAlpha=ca;
    const m=from+(S.to-from)*eio(segT/Math.max(.8,cur.dur*.85));
    chip(S.chip,290,1);scoreboard(score(m),370);chart(m,t,segT,S);highlight(S,segT,cur.dur);
    g.globalAlpha=1;
  } else if(n<=16) goals(t);
  else cta(t,cur);
  // transition : volet soleil entre chapitres
  for(const s of TL.segs){const d=t-s.start;if(['s4','s15','s17'].includes(s.id)&&d>-.25&&d<.25){const k=1-Math.abs(d)/.25;g.fillStyle=`rgba(255,182,72,${k*.9})`;g.fillRect(0,H*(1-k)/2,W,H*k);}}
  captions(t);
  // barre de progression
  g.fillStyle='rgba(255,255,255,.12)';g.fillRect(0,H-8,W,8);g.fillStyle=C.sun;g.fillRect(0,H-8,W*t/TL.total,8);
};
window.setup=async function(tl){TL=tl;await document.fonts.load(F(900,40));await document.fonts.load(F(500,20,'JetBrains Mono'));await document.fonts.load(F(800,20,'JetBrains Mono'));return true;};
</script></body></html>
